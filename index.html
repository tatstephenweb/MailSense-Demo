<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MailSense</title>

<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700,900&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Satoshi', 'ui-sans-serif', 'system-ui', 'sans-serif']
        },
        colors: {
          canvas: '#FFFDF1',
          panel: '#29700A',
          panelmuted: '#5AC74A',
          border: 'rgba(255,255,255,0.04)',
          ink: '#222222',
          muted: '#FFFDF1',
          faint: '#FFFFFF',
          accent: '#38c6b4',
          high: '#ef4444',
          medium: '#eab308',
          low: '#22c55e'
        }
      }
    }
  }
</script>

<link rel="stylesheet" href="style.css">
</head>
<body class="bg-canvas text-ink font-sans antialiased h-screen overflow-hidden">

<div class="flex h-full">

  <!-- Sidebar backdrop, mobile only -->
  <div id="sidebar-backdrop" class="fixed inset-0 bg-black/70 z-30 hidden md:hidden"></div>

  <!-- Sidebar -->
  <aside id="sidebar"
    class="fixed md:static z-40 inset-y-0 left-0 w-72 -translate-x-full md:translate-x-0
           transition-transform duration-200 ease-out
           bg-panel border-r border-border flex flex-col h-full">

    <!-- Brand -->
    <div class="flex items-center gap-2.5 px-5 pt-6 pb-5 shrink-0 border-b border-border/10">
      <img class="w-8" src="Frame.png">
      <span class="text-[17px] font-bold tracking-tight">MailSense</span>
      <button id="close-sidebar" class="ml-auto md:hidden text-faint hover:text-ink p-1" aria-label="Close menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Scrollable nav -->
    <nav id="side-nav" class="flex-1 overflow-y-auto custom-scroll px-3 pt-3 pb-4 space-y-7">

      <div>
        <button data-nav="all" class="nav-item nav-item--active w-full flex items-center gap-2.5 rounded-lg px-3 py-2.5 text-[15px] font-medium">
          All Inboxes
        </button>
      </div>

      <div>
        <p class="px-3 mb-2 text-[11px] font-bold text-faint tracking-wide">All priorities</p>
        <div class="space-y-1">
          <button data-priority="high" class="priority-item w-full flex items-center gap-2.5 rounded-lg px-3 py-2.5">
            <span class="h-2 w-2 rounded-sm bg-high shrink-0"></span>
            High
          </button>
          <button data-priority="medium" class="priority-item w-full flex items-center gap-2.5 rounded-lg px-3 py-2.5 text-[15px] font-medium">
            <span class="h-2 w-2 rounded-sm bg-medium shrink-0"></span>
            Medium
          </button>
          <button data-priority="low" class="priority-item w-full flex items-center gap-2.5 rounded-lg px-3 py-2.5 text-[15px] font-medium">
            <span class="h-2 w-2 rounded-sm bg-low shrink-0"></span>
            Low
          </button>
        </div>
      </div>

      <div>
        <p class="px-3 mb-2 text-[11px] font-semibold text-faint tracking-wide">Other</p>
        <div class="space-y-1">
          <button class="nav-item w-full flex items-center justify-between rounded-lg px-3 py-2.5 text-[15px] font-medium text-muted cursor-not-allowed">
            <span>Notification</span>
            <span class="text-[10px] font-semibold text-faint border border-border rounded px-1.5 py-0.5">Soon</span>
          </button>
          <button class="nav-item w-full flex items-center justify-between rounded-lg px-3 py-2.5 text-[15px] font-medium text-muted cursor-not-allowed">
            <span>Settings</span>
            <span class="text-[10px] font-semibold text-faint border border-border rounded px-1.5 py-0.5">Soon</span>
          </button>
        </div>
      </div>

    </nav>

    <!-- Reserved slot for an upcoming game -->
    <div class="px-3 pb-3 pt-3 shrink-0 border-t border-border/10">
      <div id="sidebar-game-slot" class="h-24 rounded-xl bg-gradient-to-br from-[#bdeef0] to-[#a7dff0]"></div>
    </div>

    <!-- Profile -->
    <div class="flex items-center gap-3 px-4 py-4 border-t border-border shrink-0">
      <div class="h-9 w-9 rounded-full bg-blue-600 flex items-center justify-center text-[15px] font-bold shrink-0">T</div>
      <span class="text-[15px] font-medium">Tat Stephen</span>
    </div>

  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col min-w-0 h-full">

    <!-- Mobile top bar -->
    <div class="md:hidden flex items-center gap-3 px-4 py-3.5 border-b border-border shrink-0 bg-panel">
      <button id="open-sidebar" class="text-ink p-1" aria-label="Open menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <span class="text-[16px] font-bold tracking-tight text-white">MailSense</span>
    </div>

    <!-- List view -->
    <section id="list-view" class="flex-1 flex flex-col min-h-0">
      <div class="px-6 md:px-10 pt-8 pb-5 shrink-0">
        <h1 id="list-title" class="text-[28px] font-bold tracking-tight">All Inboxes</h1>
      </div>
      <div id="mail-list" class="flex-1 overflow-y-auto custom-scroll px-2 md:px-2 pb-8"></div>
    </section>

    <!-- Detail view -->
    <section id="detail-view" class="hidden flex-1 flex-col min-h-0">
      <div class="px-4 md:px-10 pt-6 pb-2 shrink-0">
        <button id="back-to-list" class="inline-flex items-center gap-2 text-[14px] font-medium text-muted hover:text-ink rounded-lg px-2 py-1.5 -ml-2">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <br>
      </div>
      <div id="mail-detail" class="flex-1 overflow-y-auto custom-scroll px-6 md:px-10 pb-10"></div>
    </section>

  </div>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
